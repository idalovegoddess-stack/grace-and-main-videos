name: Buffer refill robot
on:
  schedule:
    - cron: "17 11 * * *"   # every morning, about 6am Chicago
  workflow_dispatch: {}      # "Run workflow" button for a manual top-up
permissions:
  contents: write
jobs:
  refill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Top up the Buffer queue
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          VIDEO_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/videos
        run: python3 refill.py
      - name: Remember what was sent
        run: |
          git config user.name "refill robot"
          git config user.email "robot@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "Robot: record posts sent to Buffer" && git push)
